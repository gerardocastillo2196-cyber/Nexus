[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfish-os"
version = "7.0.0"
description = "Jellyfish OS — Framework multi-agente y sistema operativo autónomo para desarrollo de software"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jellyfish OS Team" }
]

dependencies = [
  "httpx>=0.28.0",
  "aiofiles>=24.1.0",
  "rich>=13.0.0",
  "prompt_toolkit>=3.0.40",
  "python-dotenv>=1.0.0",
  "Jinja2>=3.1.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.6.0",
  "chromadb>=1.0.0",
  "langchain>=1.0.0",
  "langchain-chroma>=0.2.0",
  "langchain-ollama>=0.3.0",
  "langchain-text-splitters>=1.0.0",
]

[project.optional-dependencies]
ml = [
  "transformers>=4.40.0",
  "torch>=2.0.0",
  "onnxruntime>=1.17.0",
]
dev = [
  "pytest>=9.0.0",
  "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
