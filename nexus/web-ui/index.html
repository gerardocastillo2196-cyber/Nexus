<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus OS — Plataforma de inteligencia artificial conversacional con agencias especializadas. Escriba para narrativa literaria. Jellyfish para desarrollo ágil multi-agente." />
    <meta name="theme-color" content="#050610" />
    <title>Nexus — Jellyfish OS v7.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Critical loading styles */
      body {
        margin: 0;
        padding: 0;
        background: #05060b;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100vh;
      }
      /* Loading animation */
      .nexus-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05060b;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .nexus-loader.hidden { opacity: 0; pointer-events: none; }
      .nexus-loader-orb {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: radial-gradient(circle, #818cf8 0%, #6366f1 50%, #4f46e5 100%);
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.5), 0 0 60px rgba(99, 102, 241, 0.2);
        animation: loader-pulse 1.4s ease-in-out infinite;
      }
      @keyframes loader-pulse {
        0%, 100% { transform: scale(0.8); opacity: 0.6; }
        50% { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="nexus-loader" id="nexus-loader">
      <div class="nexus-loader-orb"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide loader when app mounts
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loader = document.getElementById('nexus-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 600);
          }
        }, 800);
      });
    </script>
  </body>
</html>
